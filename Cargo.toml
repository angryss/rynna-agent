[workspace]
members = [
  "apps/cli",
  "apps/desktop/src-tauri",
  "crates/rynna-config",
  "crates/rynna-core",
  "crates/rynna-workflows",
  "crates/rynna-mcp",
  "crates/rynna-skills",
  "crates/rynna-memory-hindsight",
  "crates/rynna-provider-anthropic",
  "crates/rynna-provider-openai",
  "crates/rynna-server",
  "crates/rynna-tools-command",
  "crates/rynna-tools-filesystem",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/angryss/rynna-agent"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
async-trait = "0.1"
cap-std = "4.0.3"
cap-fs-ext = "4.0.3"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "6"
fs2 = "0.4"
futures-util = "0.3"
globset = "0.4"
libc = "0.2"
process-wrap = { version = "10.0.0", default-features = false, features = ["kill-on-drop", "process-group", "tokio1"] }
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "test-util", "time"] }
toml = "1.1"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
