[package]
name = "rynna-desktop"
description = "Tauri desktop host for Rynna"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "rynna_desktop"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "rynna-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rynna-workflows = { path = "../../../crates/rynna-workflows" }
rynna-skills = { path = "../../../crates/rynna-skills" }
uuid.workspace = true
rynna-mcp = { path = "../../../crates/rynna-mcp" }
rynna-memory-hindsight = { path = "../../../crates/rynna-memory-hindsight" }
async-trait.workspace = true
rynna-config = { path = "../../../crates/rynna-config" }
rynna-core = { path = "../../../crates/rynna-core" }
rynna-provider-anthropic = { path = "../../../crates/rynna-provider-anthropic" }
rynna-provider-openai = { path = "../../../crates/rynna-provider-openai" }
rynna-tools-command = { path = "../../../crates/rynna-tools-command" }
rynna-tools-filesystem = { path = "../../../crates/rynna-tools-filesystem" }
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tempfile.workspace = true
tokio.workspace = true

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
