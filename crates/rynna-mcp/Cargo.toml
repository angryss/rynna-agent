[package]
name = "rynna-mcp"
description = "Profile-scoped MCP client and tool adapter for Rynna"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rynna-core = { path = "../rynna-core" }
rynna-config = { path = "../rynna-config" }
rmcp = { version = "3.2", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"] }
# rmcp's child-process transport and this crate must use the same process-wrap types.
process-wrap = { workspace = true, features = ["job-object"] }
libc.workspace = true
async-trait.workspace = true
futures-util.workspace = true
reqwest.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true

[dev-dependencies]
tempfile.workspace = true
axum.workspace = true
