version = 1
default_profile = "local"

# Providers are reusable connection definitions. Never put API keys here;
# reference the name of an environment variable instead.
[providers.ollama]
kind = "openai-compatible"
api_base = "http://127.0.0.1:11434/v1"

# MLX LM serves OpenAI-compatible chat completions. The URL below is also
# the default for kind = "mlx" when api_base is omitted.
[providers.mlx]
kind = "mlx"
api_base = "http://127.0.0.1:8000/v1"

[providers.work-openai]
kind = "openai-compatible"
api_base = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"

[providers.openrouter]
kind = "openai-compatible"
api_base = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"

[providers.anthropic-api]
kind = "anthropic-messages"
api_base = "https://api.anthropic.com"
api_key_env = "ANTHROPIC_API_KEY"

# Uses Claude Code's supported account-backed headless interface. Enable extra
# usage / a usage bundle in Claude so work can continue after plan limits.
[providers.claude-subscription]
kind = "claude-subscription"
claude_program = "claude"

# Profiles select a provider and model and scope capability activation.
[profiles.local]
provider = "ollama"
model = "qwen3:8b"
system_prompt = "You are Rynna, a careful and capable local AI software agent."
default_project_directory = "."
# A named project may span multiple directories; its default must be one of them.
projects = [
  { name = "rynna", directories = [".", "../shared"], default_directory = "." },
]
# Enable installed Agent Skills by name or directory (see docs/skills.md).
active_skills = [] # e.g. ["code-review", "./skills/rust"]
capabilities = ["workspace"]

# Helpers belong only to this profile and inherit its model, project and tools.
[[profiles.local.subagents]]
name = "reviewer"
description = "Review code changes for correctness and missing tests."
instructions = "Inspect the requested changes and report actionable issues with file references."

# Use the exact Hugging Face ID or local model path served by mlx_lm.server.
[profiles.mlx]
provider = "mlx"
model = "mlx-community/Qwen3.8-27B-8bit"
capabilities = ["workspace"]

[profiles.work]
provider = "work-openai"
model = "gpt-5"
system_prompt = "You are Rynna, a careful AI software agent working in a professional environment."
active_skills = [] # Independent from local; install packages before enabling them.
mcp_servers = ["github"]
capabilities = ["workspace"]

[profiles.openrouter]
provider = "openrouter"
model = "openai/gpt-5.2"
capabilities = ["workspace"]

[profiles.anthropic]
provider = "anthropic-api"
model = "claude-sonnet-4-5"
capabilities = ["workspace"]

# Account-backed profiles intentionally cannot declare capabilities, skills,
# or MCP servers; Claude Code runs headlessly with all internal tools disabled.
[profiles.claude-account]
provider = "claude-subscription"
model = "sonnet"

# Native capabilities execute in-process and are separate from skills and MCP servers.
# Relative roots are resolved from Rynna's process working directory.
[capabilities.workspace]
kind = "filesystem"
root = "."
read_only = false
allowed_patterns = []
# Omit denied_patterns and protected_patterns to retain secure built-in defaults.
max_read_bytes = 1048576
max_results = 1000
max_traversal_files = 10000
max_traversal_depth = 32
max_search_bytes = 16777216

# Command capabilities are intentionally not active in the example profiles.
# To let a macOS profile inspect its operating system, add "host-commands" to
# that profile's capabilities and uncomment this block. Command capabilities
# currently require a Unix host; use platform-correct absolute paths on Linux.
# [capabilities.host-commands]
# kind = "command"
# working_directory = "."
# programs = { uname = "/usr/bin/uname", sw_vers = "/usr/bin/sw_vers" }
# timeout_seconds = 5
# max_output_bytes = 65536

[mcp_servers.github]
transport = "stdio"
command = "docker"
args = ["run", "--rm", "-i", "ghcr.io/github/github-mcp-server"]
env = ["GITHUB_PERSONAL_ACCESS_TOKEN"]

# Optional profile-owned workflow. The built-in rynna-default is always available.
[[profiles.local.workflows]]
id = "implement-review"
name = "Implement and review"
description = "Implement a goal and check every success criterion."
revision = 1

[[profiles.local.workflows.steps]]
id = "implement"
role = "work"
executor = "instructions"
instructions = "Implement the goal using the permitted tools and address verification feedback."

[[profiles.local.workflows.steps]]
id = "verify"
role = "verify"
executor = "instructions"
instructions = "Check every criterion and return the requested structured evidence."
repeat_target = "implement"
